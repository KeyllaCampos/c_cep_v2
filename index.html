<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultador de CEPS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="container">
        <h1>Consultador de CEPS</h1>
        <p class="subtitulo">Consulte endereços de todo o Brasil usando a API gratuita do ViaCEP. </p>

        <!--formulario de busca-->
        <form id="formBusca" class="busca-form" onsubmit="event.preventDefault();">

            <div class="campo">
                <label for="uf">Estado (UF)</label>
                <select id="uf" required>
                    <option value="">Selecione o estado...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Ex: Campo Verde..." required minlength="3">

            </div>

            <div class="campo">
                <label for="rua">Rua/Logradoura</label>
                <input type="text" id="rua" placeholder="Ex:Rua João Pessoa..." required minlength="3">
            </div>
            <button type="button" id="btnBuscar">Buscar</button>

        </form>

        <div id="mensagem" class="menagem oculto"></div>

        <div id="resultado" class="resultado oculto">
           <h3>Resultado Encontrados:</h3> 
           <div id="listaResultados" class="lista-resultado"></div>
        </div>

        <footer> Documentação Oficial: <a href="http://viacep.com.br/" target="_blank" rel="noopener noreferrer">ViaCEP WebService</a>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
